<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sundial</title>
    <meta name="description" content="When is there enough light outside to see?" />
    <meta name="theme-color" content="#eef2fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#05070d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sundial" />
    <!-- Absolute so Vite rewrites them for the /sundial/ base. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <header class="chrome">
        <div class="daterow">
          <button id="prev" class="step" type="button" aria-label="Previous day">‹</button>
          <button id="datebtn" class="date" type="button" aria-label="Choose a date">
            <span id="datelabel">—</span>
          </button>
          <button id="next" class="step" type="button" aria-label="Next day">›</button>
        </div>
        <div class="locrow">
          <button id="locbtn" class="loc" type="button">
            <span id="locname" class="locname">Locating…</span>
            <span id="loccoords" class="loccoords"></span>
          </button>
          <button id="alarmbtn" class="pill" type="button" aria-pressed="false">
            <span id="alarmbtnlabel">Set alarm</span>
          </button>
          <!-- A glyph, not a word: the location row already carries a name, coordinates
               and the alarm time, and two text pills squeeze the name to nothing. -->
          <button id="nightbtn" class="pill glyph" type="button" aria-label="Night mode">☾</button>
          <button id="today" class="pill" type="button" hidden>Today</button>
        </div>
        <!-- Off-screen rather than display:none so the native picker still opens. -->
        <input id="datepicker" class="offscreen" type="date" tabindex="-1" aria-hidden="true" />
      </header>

      <section id="day" class="day" aria-label="Light through the day">
        <div id="hours" class="hours" aria-hidden="true"></div>
        <div id="ticks" class="ticks" aria-hidden="true"></div>
        <div id="labels" class="labels"></div>
        <!-- After #labels so the marker draws over them, and the only thing in the
             column that takes pointer events. -->
        <div id="alarm" class="alarm" hidden>
          <div
            id="alarmgrip"
            class="alarmgrip"
            role="slider"
            tabindex="0"
            aria-label="Alarm time"
            aria-valuemin="0"
            aria-valuemax="1435"
            aria-valuenow="420"
          >
            <span id="alarmreadout" class="alarmreadout"
              ><span id="alarmtime" class="t"></span><span id="alarmrel" class="r"></span
            ></span>
          </div>
        </div>
        <div id="notes" class="notes"></div>
      </section>

      <footer id="footer" class="footer"></footer>
    </main>

    <dialog id="locsheet" class="sheet">
      <form method="dialog" class="sheethead">
        <h2>Location</h2>
        <button class="ghost" value="close" aria-label="Close">Done</button>
      </form>
      <ul id="locoptions" class="locoptions"></ul>
      <form id="addloc" class="addloc">
        <h3>Add a place</h3>
        <div class="fields">
          <input id="addname" name="name" type="text" placeholder="Name" required autocomplete="off" />
          <input id="addlat" name="lat" type="number" placeholder="Latitude" step="any" min="-90" max="90" required />
          <input id="addlon" name="lon" type="number" placeholder="Longitude" step="any" min="-180" max="180" required />
        </div>
        <button type="submit">Save place</button>
        <p id="adderror" class="adderror" role="alert" hidden></p>
      </form>
      <form method="dialog" class="prefs">
        <h3>Clock</h3>
        <div class="segmented">
          <button id="clock24" type="button">24h</button>
          <button id="clock12" type="button">12h</button>
        </div>
        <p class="fineprint">
          Times are computed on device and shown in this device's timezone. Sea-level horizon with
          standard refraction — real terrain will shift what you see by minutes.
        </p>
      </form>
    </dialog>

    <!-- The tent clock. A separate surface the user opts into, so the day column
         keeps its promise of holding no live state. -->
    <div id="night" class="night" hidden>
      <div id="nightclock" class="nightclock">
        <div id="nighttime" class="nighttime">--:--</div>
        <div id="nightsub" class="nightsub"></div>
      </div>
      <p id="nighthint" class="nighthint" hidden>Install to the home screen for a full-screen clock.</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
